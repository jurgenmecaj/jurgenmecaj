<!DOCTYPE html>

<head>

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
(() => {
'use strict';

/* =====================================================================
   KLUBI LIVE – lojë animacioni për TikTok LIVE (stilizuar, pa përmbajtje eksplicite)
   Parametra URL:  ?demo=1  simulim   ?ws=ws://host:port   ?mute=1   ?music=0   ?voice=0   ?photos=1 (foto profili)
                   ?debug=1  Tastet: J hyrje · 1-5 dhurata · L like · K kënga tjetër · M zë on/off
   ===================================================================== */

const W = 1080, H = 1920;
const Q = new URLSearchParams(location.search);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

/* ------------------------------ konfigurim ------------------------------ */
const CFG = {
  wsUrl: Q.get('ws') || 'ws://localhost:8124',
  lek: 100,                 // sa lekë vlen 1 💎 (për numëruesin e bakshishit)
  maxFloor: 12,             // sa shikues njëkohësisht në pistë
  vipSec: 25,               // sekonda bazë në VIP
  photos: Q.has('photos'),  // foto profili në vend të figurave të vizatuara
  floorTop: 1100, floorBottom: 1575,
};
// Nivelet e dhuratave (diamante për një dhuratë). Emri me "lion/luan" = MBRETI.
const TIERS = [
  { min: 1,    key: 'cash',   label: 'Para',          icon: '💵' },
  { min: 5,    key: 'rain',   label: 'Shi parash',    icon: '💸' },
  { min: 30,   key: 'vip',    label: 'VIP me kërcimtaren', icon: '🛋️' },
  { min: 100,  key: 'bottle', label: 'Shishe për klubin',  icon: '🍾' },
  { min: 1000, key: 'king',   label: 'MBRETI I KLUBIT',    icon: '👑' },
];
const KING_RE = /lion|luan|universe|galaxy/i;
const tierOf = (d, name) => { if (KING_RE.test(name || '')) return TIERS[4]; let t = TIERS[0]; for (const x of TIERS) if (d >= x.min) t = x; return t; };

const OUTFITS = ['#ff2e93', '#00e5ff', '#ffd60a', '#9b5de5', '#00f5a0', '#ff6b35', '#f72585', '#4cc9f0', '#e63946', '#7cff3a'];
const SHIRTS = ['#1d3557', '#e63946', '#2a9d8f', '#e9c46a', '#9b5de5', '#f77f00', '#118ab2', '#ef476f', '#222a44', '#6a994e'];
const SKINS = ['#f2c9a0', '#e0a97c', '#c68642', '#8d5524', '#ffdbac', '#f5d0b5'];
const HAIRS = ['#1b1b1b', '#5a2d0c', '#c8963e', '#f5d76e', '#d1306a', '#6a2c91', '#2b2b3c', '#7a1f1f'];
const BILL_COL = ['#3fa66b', '#4aa3d8', '#c8963e', '#b45fa8'];

const SONGS = [
  { title: 'Nata është jona', style: 0, bpm: 124, hue: 320, lines: ['Nata është jona, ndiz dritat!', 'Duart lart, zemra rreh!', 'Kërce, kërce, mos u ndal!', 'Këtu jemi bashkë, bashkë!'] },
  { title: 'Dritat e qytetit', style: 1, bpm: 92, hue: 190, lines: ['Dritat e qytetit po digjen', 'Ritmi na çon pa pushim', 'Çdo hap është histori', 'Sonte askush nuk fle'] },
  { title: 'Valle neoni', style: 2, bpm: 104, hue: 40, lines: ['Shtrëngoje dorën, vallëzo', 'Zemra jonë është ritmi', 'Hej, hej, ejani të gjithë', 'Klubi ynë është shtëpia'] },
];

/* ------------------------------ ndihmëse ------------------------------ */
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
const poly = (c, pts) => { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); };
function fitText(c, text, maxW, size, weight = '800') {
  let s = size;
  do { c.font = `${weight} ${s}px "Segoe UI", Arial, sans-serif`; s -= 2; }
  while (c.measureText(text).width > maxW && s > 12);
}
function outlined(c, text, x, y, fill, stroke = 'rgba(0,0,0,.85)', lw = 5) {
  c.lineJoin = 'round'; c.lineWidth = lw; c.strokeStyle = stroke; c.strokeText(text, x, y);
  c.fillStyle = fill; c.fillText(text, x, y);
}
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16), f = c => clamp(Math.round(c + (k > 0 ? (255 - c) : c) * k), 0, 255);
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
const OUT = '#1b1530';
const money = n => Math.round(n).toLocaleString('en-US').replace(/,/g, '.');
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.style.left = (innerWidth - W * s) / 2 + 'px'; cv.style.top = (innerHeight - H * s) / 2 + 'px';
}
addEventListener('resize', fit); fit();

/* ------------------------------ gjendja ------------------------------ */
const S = {
  t: 0, viewers: [], girls: [], bills: [], parts: [], floats: [], waiters: [], timers: [],
  byName: new Map(), queue: [], banner: null, hero: null, scores: {}, tips: 0, topName: '',
  song: 0, songStart: 0, nextSong: 70, songBanner: 0, king: null, storm: 0, flash: 0, flashCol: '#fff',
  status: 'offline', tt: 'waiting', likeBudget: 0, joined: 0, shake: 0, dbg: { avOk: 0, avFail: 0 },
};
const later = (sec, fn) => S.timers.push({ at: S.t + sec, fn });
const song = () => SONGS[S.song];
const beatNow = () => (S.t - S.songStart) * song().bpm / 60;

/* ------------------------------ zëri: efekte + muzikë + shqip ------------------------------ */
const snd = (() => {
  let ac = null, master = null, muted = Q.has('mute'), last = {};
  const vol = Q.has('vol') ? +Q.get('vol') : 1;
  const A = () => {
    if (muted) return null;
    try {
      if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = vol; master.connect(ac.destination); startMusic(); }
      if (ac.state === 'suspended') ac.resume();
      return ac;
    } catch (e) { return null; }
  };
  const tone = (f0, f1, dur, v, type = 'sine', delay = 0, dest) => {
    const a = A(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(f1, 20), t + dur);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + dur + 0.05);
  };
  const nz = (dur, v, o = {}) => {
    const a = A(); if (!a) return;
    const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (o.attack ? Math.min(1, i / (a.sampleRate * o.attack)) * (1 - i / n) : (1 - i / n));
    const s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain(), t = (o.at ?? a.currentTime) + (o.delay || 0);
    s.buffer = buf; fl.type = o.type || 'lowpass'; fl.frequency.setValueAtTime(o.f || 1000, t); if (o.f2) fl.frequency.linearRampToValueAtTime(o.f2, t + dur);
    if (o.q) fl.Q.value = o.q; g.gain.value = v; s.connect(fl); fl.connect(g); g.connect(o.dest || master); s.start(t);
  };
  const gate = (k, ms, fn) => () => { const n = performance.now(); if (n - (last[k] || 0) < ms) return; last[k] = n; fn(); };

  /* ---- muzika: sekuencues me 16 hapa ---- */
  const N = { A1: 55, C2: 65.4, D2: 73.4, E2: 82.4, F2: 87.3, G2: 98, A2: 110, Bb2: 116.5, C3: 130.8, Cs3: 138.6 };
  const SC = [440, 466.2, 554.4, 587.3, 659.3, 698.5, 784, 880]; // A frigjisht-dominant (ngjyrë ballkanike)
  let musicOn = Q.get('music') !== '0', step = 0, nextT = 0, timer = null, lastSong = -1;
  const kick = (t, v = .55) => { const a = ac, o = a.createOscillator(), g = a.createGain(); o.frequency.setValueAtTime(165, t); o.frequency.exponentialRampToValueAtTime(42, t + .13); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + .32); o.connect(g); g.connect(master); o.start(t); o.stop(t + .35); };
  const clap = (t, v = .2) => { nz(.14, v, { type: 'bandpass', f: 1500, q: .8, at: t }); nz(.1, v * .7, { type: 'bandpass', f: 1800, q: .8, at: t + .012 }); };
  const hat = (t, open) => nz(open ? .2 : .045, open ? .07 : .06, { type: 'highpass', f: 7000, at: t });
  const bass = (t, f, dur, v = .2) => { const a = ac, o = a.createOscillator(), g = a.createGain(), fl = a.createBiquadFilter(); o.type = 'sawtooth'; o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.setValueAtTime(700, t); fl.frequency.exponentialRampToValueAtTime(140, t + dur); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(fl); fl.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02); };
  const lead = (t, f, dur, v = .045) => { const a = ac, o = a.createOscillator(), g = a.createGain(), fl = a.createBiquadFilter(); o.type = 'square'; o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.value = 2400; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(fl); fl.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02); };
  const dum = (t) => tone(210, 110, .22, .22, 'sine', t - ac.currentTime), tek = (t, v = .1) => nz(.07, v, { type: 'bandpass', f: 3200, q: 1.2, at: t });
  function play(st, t) {
    const bar = Math.floor(st / 16) % 4, k = st % 16, sg = S.song;
    if (sg === 0) { // House
      if (k % 4 === 0) kick(t); if (k === 4 || k === 12) clap(t); if (k % 4 === 2) hat(t, true); else if (k % 2 === 1) hat(t, false);
      const root = [N.A1, N.A1, N.F2 / 2, N.G2 / 2][bar]; if ([0, 3, 6, 10, 12, 15].includes(k)) bass(t, root * (k === 10 ? 2 : 1), .22);
      if (k % 4 === 2) lead(t, [N.A2 * 4, N.C3 * 4, N.E2 * 8, N.C3 * 4][bar % 4], .18, .035);
    } else if (sg === 1) { // Hip-hop
      if (k === 0 || k === 7 || k === 10) kick(t, .6); if (k === 4 || k === 12) clap(t, .26); if (k % 2 === 0) hat(t, k === 14);
      if (k === 0 || k === 7 || k === 10) bass(t, [N.A1, N.A1, N.F2 / 2, N.E2 / 2][bar], .5, .26);
      if (k === 2 && bar % 2) lead(t, 880, .3, .03);
    } else { // Ballkanik
      if (k === 0 || k === 6 || k === 10) dum(t); if (k === 4 || k === 12) tek(t, .16); if (k % 2 === 0 && k !== 4 && k !== 12) tek(t, .06);
      if (k % 4 === 0) kick(t, .28);
      const arp = [0, 1, 2, 1, 3, 2, 1, 0, 2, 3, 4, 3, 2, 1, 0, 1]; if (k % 2 === 0) lead(t, SC[arp[(k + bar * 4) % 16] % SC.length], .22, .04);
      if (k === 0 || k === 8) bass(t, [N.A1, N.A1, N.Bb2 / 2, N.A1][bar], .4, .2);
    }
  }
  function tick() {
    if (!ac || muted || !musicOn) return;
    if (lastSong !== S.song) { lastSong = S.song; step = 0; nextT = ac.currentTime + .08; }
    const dur = 60 / song().bpm / 4;
    while (nextT < ac.currentTime + .18) { play(step, nextT); nextT += dur; step = (step + 1) % 64; }
  }
  function startMusic() { if (!timer) timer = setInterval(tick, 40); }
  return {
    toggle() { muted = !muted; if (master) master.gain.value = muted ? 0 : vol; if (!muted) A(); },
    isMuted: () => muted,
    blocked: () => !muted && ac && ac.state === 'suspended',
    resume: () => A(),
    join: gate('jn', 150, () => { tone(520, 780, .16, .07, 'triangle'); tone(780, 1040, .18, .05, 'triangle', .09); }),
    coin: gate('cn', 60, () => { tone(1800, 2400, .09, .06, 'triangle'); tone(2400, 3000, .12, .04, 'triangle', .06); }),
    coins: gate('cs', 200, () => { for (let i = 0; i < 6; i++) tone(1600 + Math.random() * 1400, 2600, .1, .05, 'triangle', i * .07); }),
    whoosh: gate('wh', 70, () => nz(.28, .05, { f: 2200 })),
    cork: gate('ck', 120, () => { nz(.1, .2, { type: 'highpass', f: 2000 }); tone(300, 120, .12, .14, 'sine'); }),
    fizz: gate('fz', 200, () => nz(1.1, .1, { type: 'highpass', f: 3500, f2: 6500 })),
    sparkle: gate('sp', 120, () => { for (let i = 0; i < 5; i++) tone(2400 + Math.random() * 1800, 3800, .08, .03, 'sine', i * .05); }),
    cheer: gate('ch', 800, () => { nz(1.8, .13, { type: 'bandpass', f: 900, f2: 700, q: .7, attack: .35 }); nz(1.5, .07, { type: 'highpass', f: 2500, attack: .4, delay: .1 }); for (let i = 0; i < 12; i++) nz(.04, .09, { type: 'highpass', f: 2200, delay: .2 + Math.random() * 1.4 }); }),
    bell: gate('bl', 400, () => { tone(1318, 1318, .5, .06); tone(1976, 1976, .4, .03); }),
    fanfare: gate('fa', 1000, () => { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, f * 1.01, .22, .07, 'triangle', i * .12)); [523, 659, 784, 1046].forEach(f => tone(f, f, .9, .04, 'triangle', .65)); }),
    swish: gate('sw', 150, () => nz(.4, .06, { type: 'bandpass', f: 600, f2: 2400, q: .9 })),
  };
})();
addEventListener('pointerdown', () => snd.resume());
addEventListener('keydown', () => snd.resume());

const voice = (() => {
  const off = Q.get('voice') === '0' || Q.has('mute');
  const synth = window.speechSynthesis, vol = Q.has('vol') ? Math.min(1, +Q.get('vol')) : 1;
  let lines = {}, clips = {}, sq = [], cur = null, last = {};
  const loadVoices = () => { try { sq = synth.getVoices().filter(v => /^sq/i.test(v.lang)); } catch (e) {} };
  if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
  fetch('voice_lines.json').then(r => r.json()).then(j => {
    lines = j;
    for (const k of Object.keys(j)) if (k.startsWith('k_')) { const a = new Audio(); a.preload = 'auto'; a.oncanplaythrough = () => { clips[k] = a.src; }; a.onerror = () => {}; a.src = `assets/voice/${k}.mp3`; }
  }).catch(() => {});
  const busy = () => (cur && !cur.ended && !cur.paused) || (synth && synth.speaking);
  function say(key, o = {}) {
    if (off || snd.isMuted()) return;
    const l = lines[key]; if (!l) return;
    const now = performance.now(); if (now - (last[key] || 0) < (o.gap ?? 5000)) return;
    if (busy()) { if (!o.prio) return; try { if (cur) cur.pause(); if (synth) synth.cancel(); } catch (e) {} }
    last[key] = now;
    if (!(o.text && sq.length) && clips[key]) { cur = new Audio(clips[key]); cur.volume = vol; cur.play().catch(() => {}); return; }
    if (!sq.length) return;
    const u = new SpeechSynthesisUtterance(o.text || l.text), want = l.voice === 'ilir' ? /Ilir/i : /Anila/i;
    u.voice = sq.find(v => want.test(v.name)) || sq[0]; u.lang = 'sq-AL'; u.rate = 1 + (parseInt(l.rate) || 0) / 100; u.pitch = l.voice === 'ilir' ? .9 : 1.05; u.volume = vol;
    try { synth.speak(u); } catch (e) {}
  }
  return { say, status: () => `${Object.keys(clips).length} klipe · ${sq.length ? sq[0].name : 'pa zë shfletuesi'}` };
})();

/* ------------------------------ sfondi (statik) ------------------------------ */
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
const vig = document.createElement('canvas'); vig.width = W; vig.height = H;
(function buildBG() {
  const g = bg.getContext('2d');
  let gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#09041c'); gr.addColorStop(.5, '#170a36'); gr.addColorStop(1, '#0a0516');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // mur me panele
  g.strokeStyle = 'rgba(255,255,255,.035)'; g.lineWidth = 2;
  for (let x = 0; x < W; x += 90) { g.beginPath(); g.moveTo(x, 300); g.lineTo(x, 1100); g.stroke(); }
  for (let y = 300; y < 1100; y += 90) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  // bari në fund të mureve (rafte me shishe)
  g.fillStyle = '#120a28'; g.fillRect(0, 1040, W, 60);
  for (let x = 40; x < W; x += 46) { g.fillStyle = `hsla(${(x * 7) % 360},70%,55%,.55)`; rr(g, x, 1000, 14, 40, 4); g.fill(); g.fillRect(x + 4, 988, 6, 14); }
  // trusa e tavanit
  g.fillStyle = '#1b1238'; g.fillRect(0, 300, W, 12);
  // zonat e VIP (tapet)
  for (const x of [30, 770]) { g.fillStyle = 'rgba(120,40,160,.22)'; rr(g, x, 840, 280, 230, 20); g.fill(); g.strokeStyle = 'rgba(255,214,10,.4)'; g.lineWidth = 3; g.stroke(); }
  // vinjeta
  const v = vig.getContext('2d'), vg = v.createRadialGradient(W / 2, H / 2, 520, W / 2, H / 2, 1260);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.62)'); v.fillStyle = vg; v.fillRect(0, 0, W, H);
})();

/* ------------------------------ figurat ------------------------------ */
const scaleAt = y => .74 + clamp((y - CFG.floorTop) / (CFG.floorBottom - CFG.floorTop), 0, 1) * .42;
function limb(c, x0, y0, x1, y1, w, col) {
  c.lineCap = 'round'; c.strokeStyle = OUT; c.lineWidth = w + 5; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
  c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
}
// pozë kërcimi sinkron me ritmin
function poseOf(o, t) {
  if (o.seated) { const b = beatNow() + o.seed; return { bob: 0, sway: Math.sin(Math.PI * b / 2) * 3, aL: .5, aR: .5 + Math.max(0, Math.sin(b * .8)) * 1.6 }; }
  const b = beatNow() + (o.seed || 0), mv = (Math.floor(b / 8) + (o.shift || 0)) % 4, pulse = Math.abs(Math.sin(Math.PI * b));
  const p = { bob: pulse * 8, sway: Math.sin(Math.PI * b / 2) * 10, aL: .3, aR: .3, spin: 0 };
  if (mv === 0) { p.aL = 2.5 + Math.sin(Math.PI * b) * .3; p.aR = 2.5 - Math.sin(Math.PI * b) * .3; }      // duart lart
  else if (mv === 1) { p.aL = Math.sin(Math.PI * b / 2) > 0 ? 2.7 : .4; p.aR = Math.sin(Math.PI * b / 2) > 0 ? .4 : 2.7; } // ndërrim
  else if (mv === 2) { p.aL = 1.5 + Math.sin(Math.PI * b) * .35; p.aR = 1.5 + Math.cos(Math.PI * b) * .35; p.spin = Math.cos(Math.PI * b / 2); } // krahë anash + rrotullim
  else { p.aL = .7; p.aR = .7; p.sway *= 1.5; }                                                              // hip
  if (o.cheers > 0) p.aR = 2.6;
  if (o.kind === 'singer') { p.spin = 0; p.aL = 2.2 + Math.sin(Math.PI * b) * .4; p.aR = 2.35; p.sway *= .6; }
  if (o.walking) { p.bob = Math.abs(Math.sin(t * 11 + (o.seed || 0))) * 5; p.sway = 0; p.aL = .35 + Math.sin(t * 11) * .3; p.aR = .35 - Math.sin(t * 11) * .3; }
  return p;
}
function glass(c, x, y) {
  c.save(); c.translate(x, y); c.fillStyle = 'rgba(255,255,255,.55)'; poly(c, [[-5, -16], [5, -16], [3, -3], [-3, -3]]); c.fill();
  c.fillStyle = '#ffe9a8'; poly(c, [[-4, -12], [4, -12], [2.5, -4], [-2.5, -4]]); c.fill(); c.fillStyle = '#fff'; c.fillRect(-1, -3, 2, 8); c.fillRect(-4, 5, 8, 2); c.restore();
}
function figure(o, t) {
  const s = o.scale, pz = poseOf(o, t), girl = o.female;
  ctx.save(); ctx.translate(o.x, o.y); ctx.scale(s * (o.flip || 1), s);
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(0, 3, 26, 8, 0, 0, 7); ctx.fill();
  if (o.lean) ctx.rotate(o.lean);
  ctx.translate(pz.sway * .4, -pz.bob); ctx.lineJoin = 'round';
  const sp = pz.spin ? Math.cos(t * 3 + (o.seed || 0)) : 1; if (pz.spin) ctx.scale(Math.max(.35, Math.abs(sp)), 1);
  const HY = -100, HR = 25;
  // flokët e pasme (vajzat)
