<canvas id="c" width="1080" height="1920"></canvas>
<script>
(() => {
'use strict';

/* =====================================================================
   KLUBI LIVE – lojë animacioni për TikTok LIVE (stilizuar, pa përmbajtje eksplicite)
   Parametra URL:  ?demo=1  simulim   ?ws=ws://host:port   ?mute=1   ?music=0   ?voice=0   ?photos=1 (foto profili)
                   ?debug=1  Tastet: J hyrje · 1-5 dhurata · L like · K kënga tjetër · M zë on/off
   ===================================================================== */

const W = 1080, H = 1920;
const Q = new URLSearchParams(location.search);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

/* ------------------------------ konfigurim ------------------------------ */
const CFG = {
  wsUrl: Q.get('ws') || 'ws://localhost:8124',
  lek: 100,                 // sa lekë vlen 1 💎 (për numëruesin e bakshishit)
  maxFloor: 12,             // sa shikues njëkohësisht në pistë
  vipSec: 25,               // sekonda bazë në VIP
  photos: Q.has('photos'),  // foto profili në vend të figurave të vizatuara
  floorTop: 1100, floorBottom: 1575,
  exitEvery: Q.has('exit') ? +Q.get('exit') : 50,   // sekonda mes daljeve "pjesë-pjesë" nga lokali (0 = pa dalje)
};
// MENUJA: 5 dhurata me ikonë → çfarë bëjnë. Njihen sipas emrit të dhuratës ose sipas vlerës në diamante.
// Çdo dhuratë TJETËR (jashtë menusë) = emri në LED + gotë për gjithë lokalin.
const GIFT_MENU = [
  { key: 'glass',  icon: '🌹', name: 'Lule',        names: /rose|lule/i,                  diamonds: 1,     out: '🥂', label: 'Gotë',          col: '#ff4fa3' },
  { key: 'rain',   icon: '🫰', name: 'Zemër',       names: /finger ?heart|zem[eë]r/i,     diamonds: 5,     out: '💸', label: 'Shi parash',    col: '#3ddc84' },
  { key: 'vip',    icon: '🍩', name: 'Donat',       names: /doughnut|donut|donat/i,       diamonds: 30,    out: '🛋️', label: 'VIP + kërcimtare', col: '#ffd60a' },
  { key: 'bottle', icon: '🫶', name: 'Zemra',       names: /hand ?hearts?|zemra/i,        diamonds: 100,   out: '🍾', label: 'Shishe',        col: '#4cc9f0' },
  { key: 'king',   icon: '🦁', name: 'Luan',        names: /lion|luan|universe|galaxy/i,  diamonds: 29999, out: '👑', label: 'Mbreti i klubit', col: '#b84dff' },
];
const matchMenu = (d, name) => GIFT_MENU.find(g => g.names.test(name || '')) || GIFT_MENU.find(g => g.diamonds === d) || null;

const OUTFITS = ['#ff2e93', '#00e5ff', '#ffd60a', '#9b5de5', '#00f5a0', '#ff6b35', '#f72585', '#4cc9f0', '#e63946', '#7cff3a'];
const SHIRTS = ['#1d3557', '#e63946', '#2a9d8f', '#e9c46a', '#9b5de5', '#f77f00', '#118ab2', '#ef476f', '#222a44', '#6a994e'];
const SKINS = ['#f2c9a0', '#e0a97c', '#c68642', '#8d5524', '#ffdbac', '#f5d0b5'];
const HAIRS = ['#1b1b1b', '#5a2d0c', '#c8963e', '#f5d76e', '#d1306a', '#6a2c91', '#2b2b3c', '#7a1f1f'];
const BILL_COL = ['#3fa66b', '#4aa3d8', '#c8963e', '#b45fa8'];
const DANCER_LINES = ['k_d1', 'k_d2', 'k_d3', 'k_d4', 'k_d5', 'k_d6', 'k_d7', 'k_d8'];

const SONGS = [
  { title: 'Nata është jona', style: 0, bpm: 124, hue: 320, scale: [220, 262, 294, 330, 392, 440], lines: ['Nata është jona, ndiz dritat!', 'Duart lart, zemra rreh!', 'Kërce, kërce, mos u ndal!', 'Këtu jemi bashkë, bashkë!'] },
  { title: 'Dritat e qytetit', style: 1, bpm: 92, hue: 190, scale: [196, 220, 247, 262, 294], lines: ['Dritat e qytetit po digjen', 'Ritmi na çon pa pushim', 'Çdo hap është histori', 'Sonte askush nuk fle'] },
  { title: 'Valle neoni', style: 2, bpm: 104, hue: 40, scale: [220, 233, 277, 294, 330, 349, 392], lines: ['Shtrëngoje dorën, vallëzo', 'Zemra jonë është ritmi', 'Hej, hej, ejani të gjithë', 'Klubi ynë është shtëpia'] },
];

/* ------------------------------ ndihmëse ------------------------------ */
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
const poly = (c, pts) => { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); };
function fitText(c, text, maxW, size, weight = '800') {
  let s = size;
  do { c.font = `${weight} ${s}px "Segoe UI", Arial, sans-serif`; s -= 2; }
  while (c.measureText(text).width > maxW && s > 12);
}
function outlined(c, text, x, y, fill, stroke = 'rgba(0,0,0,.85)', lw = 5) {
  c.lineJoin = 'round'; c.lineWidth = lw; c.strokeStyle = stroke; c.strokeText(text, x, y);
  c.fillStyle = fill; c.fillText(text, x, y);
}
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16), f = c => clamp(Math.round(c + (k > 0 ? (255 - c) : c) * k), 0, 255);
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
const OUT = '#1b1530';
const money = n => Math.round(n).toLocaleString('en-US').replace(/,/g, '.');
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.style.left = (innerWidth - W * s) / 2 + 'px'; cv.style.top = (innerHeight - H * s) / 2 + 'px';
}
addEventListener('resize', fit); fit();

/* ------------------------------ gjendja ------------------------------ */
const S = {
  t: 0, viewers: [], girls: [], bills: [], parts: [], floats: [], waiters: [], timers: [], tables: [],
  byName: new Map(), queue: [], banner: null, hero: null, scores: {}, tips: 0, topName: '',
  song: 0, songStart: 0, nextSong: 75, lastLine: -1, king: null, flash: 0, flashCol: '#fff', nextTalk: 6,
  status: 'offline', tt: 'waiting', likeBudget: 0, joined: 0, shake: 0, dbg: { avOk: 0, avFail: 0 },
  away: [], guards: [], nextExit: Math.min(50, CFG.exitEvery || 50), likeCnt: 0, used: {},
};
const later = (sec, fn) => S.timers.push({ at: S.t + sec, fn });
const song = () => SONGS[S.song];
const beatNow = () => (S.t - S.songStart) * song().bpm / 60;

/* ------------------------------ zëri: efekte + muzikë + vokale ------------------------------ */
const snd = (() => {
  let ac = null, master = null, muted = Q.has('mute'), last = {};
  const vol = Q.has('vol') ? +Q.get('vol') : 1;
  const A = () => {
    if (muted) return null;
    try {
      if (!ac) {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = vol;
        const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6; // mbron nga shtrembërimi
        master.connect(comp); comp.connect(ac.destination); startMusic();
      }
      if (ac.state === 'suspended') ac.resume();
      return ac;
    } catch (e) { return null; }
  };
  const tone = (f0, f1, dur, v, type = 'sine', delay = 0) => {
    const a = A(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(f1, 20), t + dur);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  };
  const nz = (dur, v, o = {}) => {
    const a = A(); if (!a) return;
    const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (o.attack ? Math.min(1, i / (a.sampleRate * o.attack)) * (1 - i / n) : (1 - i / n));
    const s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain(), t = (o.at ?? a.currentTime) + (o.delay || 0);
    s.buffer = buf; fl.type = o.type || 'lowpass'; fl.frequency.setValueAtTime(o.f || 1000, t); if (o.f2) fl.frequency.linearRampToValueAtTime(o.f2, t + dur);
    if (o.q) fl.Q.value = o.q; g.gain.value = v; s.connect(fl); fl.connect(g); g.connect(master); s.start(t);
  };
  const gate = (k, ms, fn) => () => { const n = performance.now(); if (n - (last[k] || 0) < ms) return; last[k] = n; fn(); };

  /* ---- zëri njerëzor i sintetizuar (formante): këngëtari dhe "uuu/hej" e kërcimtareve ---- */
  const FORM = { a: [800, 1150, 2900], e: [420, 1800, 2600], i: [280, 2250, 3000], o: [480, 850, 2800], u: [330, 780, 2700] };
  const vocal = (f0, dur, vw = 'a', v = .06, delay = 0, f1 = 0) => {
    const a = A(); if (!a) return; const t = a.currentTime + delay;
    const o = a.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.linearRampToValueAtTime(f1, t + dur);
    const lfo = a.createOscillator(), lg = a.createGain(); lfo.frequency.value = 5.3; lg.gain.value = f0 * .013; lfo.connect(lg); lg.connect(o.frequency);
    const env = a.createGain(); env.gain.setValueAtTime(.0001, t); env.gain.linearRampToValueAtTime(v * 5, t + .06); env.gain.setValueAtTime(v * 5, t + Math.max(.07, dur - .14)); env.gain.exponentialRampToValueAtTime(.0001, t + dur);
    (FORM[vw] || FORM.a).forEach((fr, i) => { const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = fr; bp.Q.value = [9, 12, 14][i]; const g = a.createGain(); g.gain.value = [1, .65, .35][i]; o.connect(bp); bp.connect(g); g.connect(env); });
    env.connect(master); o.start(t); lfo.start(t); o.stop(t + dur + .05); lfo.stop(t + dur + .05);
  };
  const vowelOf = w => { const m = w.toLowerCase().replace(/[^aeëiouy]/g, ''); const c = m[m.length - 1] || 'a'; return c === 'ë' ? 'e' : c === 'y' ? 'u' : c; };

  /* ---- muzika: sekuencues me 16 hapa ---- */
  const N = { A1: 55, C2: 65.4, D2: 73.4, E2: 82.4, F2: 87.3, G2: 98, A2: 110, Bb2: 116.5, C3: 130.8 };
  const SC = [440, 466.2, 554.4, 587.3, 659.3, 698.5, 784, 880];
  let musicOn = Q.get('music') !== '0', step = 0, nextT = 0, timer = null, lastSong = -1;
  const kick = (t, v = .55) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(165, t); o.frequency.exponentialRampToValueAtTime(42, t + .13); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + .32); o.connect(g); g.connect(master); o.start(t); o.stop(t + .35); };
  const clap = (t, v = .2) => { nz(.14, v, { type: 'bandpass', f: 1500, q: .8, at: t }); nz(.1, v * .7, { type: 'bandpass', f: 1800, q: .8, at: t + .012 }); };
  const hat = (t, open) => nz(open ? .2 : .045, open ? .07 : .06, { type: 'highpass', f: 7000, at: t });
  const bass = (t, f, dur, v = .2) => { const o = ac.createOscillator(), g = ac.createGain(), fl = ac.createBiquadFilter(); o.type = 'sawtooth'; o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.setValueAtTime(700, t); fl.frequency.exponentialRampToValueAtTime(140, t + dur); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(fl); fl.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02); };
  const lead = (t, f, dur, v = .045) => { const o = ac.createOscillator(), g = ac.createGain(), fl = ac.createBiquadFilter(); o.type = 'square'; o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.value = 2400; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(fl); fl.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02); };
  const dum = t => tone(210, 110, .22, .22, 'sine', t - ac.currentTime), tek = (t, v = .1) => nz(.07, v, { type: 'bandpass', f: 3200, q: 1.2, at: t });
  function play(st, t) {
    const bar = Math.floor(st / 16) % 4, k = st % 16, sg = S.song;
    if (sg === 0) {
      if (k % 4 === 0) kick(t); if (k === 4 || k === 12) clap(t); if (k % 4 === 2) hat(t, true); else if (k % 2 === 1) hat(t, false);
      const root = [N.A1, N.A1, N.F2 / 2, N.G2 / 2][bar]; if ([0, 3, 6, 10, 12, 15].includes(k)) bass(t, root * (k === 10 ? 2 : 1), .22);
      if (k % 4 === 2) lead(t, [N.A2 * 4, N.C3 * 4, N.E2 * 8, N.C3 * 4][bar % 4], .18, .03);
    } else if (sg === 1) {
      if (k === 0 || k === 7 || k === 10) kick(t, .6); if (k === 4 || k === 12) clap(t, .26); if (k % 2 === 0) hat(t, k === 14);
      if (k === 0 || k === 7 || k === 10) bass(t, [N.A1, N.A1, N.F2 / 2, N.E2 / 2][bar], .5, .26);
    } else {
      if (k === 0 || k === 6 || k === 10) dum(t); if (k === 4 || k === 12) tek(t, .16); if (k % 2 === 0 && k !== 4 && k !== 12) tek(t, .06);
      if (k % 4 === 0) kick(t, .28);
      const arp = [0, 1, 2, 1, 3, 2, 1, 0, 2, 3, 4, 3, 2, 1, 0, 1]; if (k % 2 === 0) lead(t, SC[arp[(k + bar * 4) % 16] % SC.length], .22, .035);
      if (k === 0 || k === 8) bass(t, [N.A1, N.A1, N.Bb2 / 2, N.A1][bar], .4, .2);
    }
  }
  function tick() {
    if (!ac || muted || !musicOn) return;
    if (lastSong !== S.song) { lastSong = S.song; step = 0; nextT = ac.currentTime + .08; }
    const dur = 60 / song().bpm / 4;
    while (nextT < ac.currentTime + .35) { play(step, nextT); nextT += dur; step = (step + 1) % 64; }
  }
  function startMusic() { if (!timer) timer = setInterval(tick, 40); }
  return {
    toggle() { muted = !muted; if (master) master.gain.value = muted ? 0 : vol; if (!muted) A(); },
    isMuted: () => muted,
    blocked: () => !muted && ac && ac.state === 'suspended',
    resume: () => A(), tick,
    // këngëtari "këndon" fjalët e vargut: çdo fjalë një notë me zanoren e saj
    sing(line, scale) {
      if (muted) return; const words = line.replace(/[!?,.]/g, '').split(/\s+/).filter(Boolean), total = words.reduce((a, w) => a + w.length + 2, 0);
      let at = .1, idx = rint(0, scale.length - 1);
      for (const w of words) {
        const dur = clamp(3.3 * (w.length + 2) / total, .22, 1.1); idx = clamp(idx + pick([-2, -1, -1, 0, 1, 1, 2]), 0, scale.length - 1);
        vocal(scale[idx], dur * .92, vowelOf(w), .05, at); at += dur;
      }
    },
    shout(kind) { // zëra të shkurtër të kërcimtareve
      if (kind === 'woo') vocal(rnd(380, 460), .55, 'o', .05, 0, rnd(560, 700));
      else if (kind === 'hey') { vocal(540, .16, 'e', .05); vocal(700, .22, 'e', .05, .19); }
      else { vocal(rnd(420, 520), .4, 'a', .045, 0, rnd(560, 640)); }
    },
    join: gate('jn', 150, () => { tone(520, 780, .16, .07, 'triangle'); tone(780, 1040, .18, .05, 'triangle', .09); }),
    coin: gate('cn', 60, () => { tone(1800, 2400, .09, .06, 'triangle'); tone(2400, 3000, .12, .04, 'triangle', .06); }),
    coins: gate('cs', 200, () => { for (let i = 0; i < 6; i++) tone(1600 + Math.random() * 1400, 2600, .1, .05, 'triangle', i * .07); }),
    cork: gate('ck', 120, () => { nz(.1, .2, { type: 'highpass', f: 2000 }); tone(300, 120, .12, .14, 'sine'); }),
    fizz: gate('fz', 200, () => nz(1.1, .1, { type: 'highpass', f: 3500, f2: 6500 })),
    sparkle: gate('sp', 120, () => { for (let i = 0; i < 5; i++) tone(2400 + Math.random() * 1800, 3800, .08, .03, 'sine', i * .05); }),
    cheer: gate('ch', 800, () => { nz(1.8, .13, { type: 'bandpass', f: 900, f2: 700, q: .7, attack: .35 }); nz(1.5, .07, { type: 'highpass', f: 2500, attack: .4, delay: .1 }); for (let i = 0; i < 12; i++) nz(.04, .09, { type: 'highpass', f: 2200, delay: .2 + Math.random() * 1.4 }); }),
    bell: gate('bl', 400, () => { tone(1318, 1318, .5, .06); tone(1976, 1976, .4, .03); }),
    fanfare: gate('fa', 1000, () => { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, f * 1.01, .22, .07, 'triangle', i * .12)); [523, 659, 784, 1046].forEach(f => tone(f, f, .9, .04, 'triangle', .65)); }),
    swish: gate('sw', 150, () => nz(.4, .06, { type: 'bandpass', f: 600, f2: 2400, q: .9 })),
    shaker: gate('sk', 200, () => { for (let i = 0; i < 4; i++) nz(.05, .06, { type: 'highpass', f: 5000, delay: i * .11 }); }),
    clink: gate('cl', 80, () => { tone(2600, 2200, .12, .05, 'sine'); tone(3400, 3000, .1, .03, 'sine', .02); }),
  };
})();
addEventListener('pointerdown', () => snd.resume());
addEventListener('keydown', () => snd.resume());

const voice = (() => {
  const off = Q.get('voice') === '0' || Q.has('mute');
  const synth = window.speechSynthesis, vol = Q.has('vol') ? Math.min(1, +Q.get('vol')) : 1;
  let lines = {}, clips = {}, sq = [], cur = null, last = {};
  const loadVoices = () => { try { sq = synth.getVoices().filter(v => /^sq/i.test(v.lang)); } catch (e) {} };
  if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
  fetch('voice_lines.json').then(r => r.json()).then(j => {
    lines = j;
    for (const k of Object.keys(j)) if (k.startsWith('k_')) { const a = new Audio(); a.preload = 'auto'; a.oncanplaythrough = () => { clips[k] = a.src; }; a.onerror = () => {}; a.src = `assets/voice/${k}.mp3`; }
  }).catch(() => {});
  const busy = () => (cur && !cur.ended && !cur.paused) || (synth && synth.speaking);
  function say(key, o = {}) {
    if (off || snd.isMuted()) return;
    const l = lines[key]; if (!l) return;
    const now = performance.now(); if (now - (last[key] || 0) < (o.gap ?? 5000)) return;
    if (busy()) { if (!o.prio) return; try { if (cur) cur.pause(); if (synth) synth.cancel(); } catch (e) {} }
    last[key] = now;
    if (!(o.text && sq.length) && clips[key]) { cur = new Audio(clips[key]); cur.volume = vol; cur.play().catch(() => {}); return; }
    if (!sq.length) return;
    const u = new SpeechSynthesisUtterance(o.text || l.text), want = l.voice === 'ilir' ? /Ilir/i : /Anila/i;
    u.voice = sq.find(v => want.test(v.name)) || sq[0]; u.lang = 'sq-AL'; u.rate = 1 + (parseInt(l.rate) || 0) / 100; u.pitch = o.pitch ?? (l.voice === 'ilir' ? .9 : 1.05); u.volume = vol;
    try { synth.speak(u); } catch (e) {}
  }
  return { say, text: k => (lines[k] && lines[k].text) || '', status: () => `${Object.keys(clips).length} klipe · ${sq.length ? sq[0].name : 'pa zë shfletuesi'}` };
})();

/* ------------------------------ LED që lëviz (tekste në lokal) ------------------------------ */
const LED = { x: 36, y: 414, w: 1008, h: 60, pitch: 4, strip: [], queue: [], idx: 0, gap: 170, speed: 150, cache: new Map(), face: null };
function ledRender(text, color) {
  const key = color + '|' + text; if (LED.cache.has(key)) return LED.cache.get(key);
  const p = LED.pitch, rows = 12, tc = document.createElement('canvas'), t = tc.getContext('2d');
  t.font = '900 11px "Arial Black", Arial, sans-serif'; const w = Math.ceil(t.measureText(text.toUpperCase()).width) + 6; tc.width = w; tc.height = rows;
  t.font = '900 11px "Arial Black", Arial, sans-serif'; t.textBaseline = 'middle'; t.fillStyle = '#fff'; t.fillText(text.toUpperCase(), 3, rows / 2 + 1);
  const d = t.getImageData(0, 0, w, rows).data, out = document.createElement('canvas'); out.width = w * p; out.height = rows * p; const o = out.getContext('2d');
